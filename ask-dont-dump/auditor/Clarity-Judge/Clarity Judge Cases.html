<script>
var DATA = JSON.parse(document.getElementById("data").textContent);
var judges = DATA.judges;
var records = DATA.records;
var picked = "C";

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function judgeOf(key) {
  for (var i = 0; i < judges.length; i++) if (judges[i].key === key) return judges[i];
}
function stateObj(rec, key) {
  return key === "A"
    ? { userPrompt: rec.prompt }
    : { earlierAssistantMessage: rec.previousAssistant, userPrompt: rec.prompt };
}
function stateText(rec, key) {
  return JSON.stringify(stateObj(rec, key), null, 2);
}
function allStatesText(key) {
  var states = [];
  for (var i = 0; i < records.length; i++) states.push(stateObj(records[i], key));
  return JSON.stringify({ states: states }, null, 2);
}
function yesCount(rec, key) {
  var n = 0;
  for (var i = 0; i < 3; i++) if (rec.votes[key][i]) n++;
  return n;
}
function judgeSaysClear(rec, key) { return yesCount(rec, key) >= 2; }
function disagrees(rec, key) { return judgeSaysClear(rec, key) !== (rec.label === "clear"); }

function labelValue(parent, label, value) {
  var s = el("span");
  s.appendChild(el("span", "lbl", label + ": "));
  s.appendChild(el("span", "val", value));
  parent.appendChild(s);
}

function selectNode(node) {
  var range = document.createRange();
  range.selectNodeContents(node);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function makeCopyButton(label, getText, getNode) {
  var wrap = el("span", "copywrap");
  var btn = el("button", "", label);
  btn.type = "button";
  var note = el("span", "note");
  note.setAttribute("role", "status");
  btn.addEventListener("click", function () {
    note.textContent = "";
    navigator.clipboard.writeText(getText()).then(
      function () { note.textContent = "Copied"; },
      function () { selectNode(getNode()); note.textContent = "Press Cmd+C"; }
    );
  });
  wrap.appendChild(btn);
  wrap.appendChild(document.createTextNode(" "));
  wrap.appendChild(note);
  return wrap;
}

var scoreEl = document.getElementById("score");
var questionsPre = document.getElementById("questions");
var questionsCopy = document.getElementById("questionsCopy");
var cardsEl = document.getElementById("cards");
var filterBox = document.getElementById("onlyBad");
var countEl = document.getElementById("count");
var pickerEl = document.getElementById("picker");

questionsCopy.appendChild(makeCopyButton("Copy questions", function () { return questionsPre.textContent; }, function () { return questionsPre; }));
var statesPre = document.getElementById("states");
var statesTitle = document.getElementById("statesTitle");
document.getElementById("statesCopy").appendChild(makeCopyButton("Copy all states", function () { return statesPre.textContent; }, function () { return statesPre; }));

function renderScore() {
  var matches = 0, falseAlarms = 0, misses = 0, differ = 0;
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var n = yesCount(r, picked);
    if (n !== 0 && n !== 3) differ++;
    if (!disagrees(r, picked)) matches++;
    else if (r.label === "clear") falseAlarms++;
    else misses++;
  }
  scoreEl.textContent = "";
  labelValue(scoreEl, "Matches your labels", matches + " of " + records.length);
  labelValue(scoreEl, "False alarms", String(falseAlarms));
  labelValue(scoreEl, "Misses", String(misses));
  labelValue(scoreEl, "Prompts where the 3 answers differ", String(differ));
}

function renderCards() {
  cardsEl.textContent = "";
  var shown = 0;
  for (var i = 0; i < records.length; i++) {
    var r = records[i];
    var bad = disagrees(r, picked);
    if (filterBox.checked && !bad) continue;
    shown++;
    var card = el("section", "card");
    var head = el("div", "row");
    labelValue(head, "Id", r.id);
    labelValue(head, "Your label", r.label);
    card.appendChild(head);
    if (r.label === "unclear" && r.reason) {
      var rs = el("div", "reason");
      rs.appendChild(el("span", "lbl", "Your reason: "));
      rs.appendChild(el("span", "", r.reason));
      card.appendChild(rs);
    }
    var vrow = el("div", "row");
    var yes = yesCount(r, picked);
    labelValue(vrow, "Haiku clear votes", yes + " of 3");
    labelValue(vrow, "Majority verdict", judgeSaysClear(r, picked) ? "clear" : "unclear");
    vrow.appendChild(el("span", bad ? "pill bad" : "pill ok", bad ? "disagrees with your label" : "matches your label"));
    card.appendChild(vrow);
    card.appendChild(el("div", "h", "State for judge " + picked));
    var pre = el("pre", "", stateText(r, picked));
    card.appendChild(pre);
    var actions = el("div", "actions");
    (function (rec, preNode) {
      actions.appendChild(makeCopyButton("Copy state", function () { return preNode.textContent; }, function () { return preNode; }));
    })(r, pre);
    actions.appendChild(makeCopyButton("Copy questions", function () { return questionsPre.textContent; }, function () { return questionsPre; }));
    card.appendChild(actions);
    cardsEl.appendChild(card);
  }
  countEl.textContent = "Showing " + shown + " of " + records.length + " prompts.";
}

function render() {
  var j = judgeOf(picked);
  questionsPre.textContent = j.questions;
  var buttons = pickerEl.querySelectorAll("button");
  for (var i = 0; i < buttons.length; i++) buttons[i].setAttribute("aria-pressed", buttons[i].dataset.key === picked ? "true" : "false");
  statesPre.textContent = allStatesText(picked);
  statesTitle.textContent = "States JSON: all " + records.length + " prompts, judge " + picked;
  renderScore();
  renderCards();
}

for (var k = 0; k < judges.length; k++) {
  (function (j) {
    var b = el("button", "", "Judge " + j.key + ": " + j.name);
    b.type = "button";
    b.dataset.key = j.key;
    b.addEventListener("click", function () { picked = j.key; render(); });
    pickerEl.appendChild(b);
  })(judges[k]);
}
filterBox.addEventListener("change", renderCards);
render();
</script>

</body></html>
