<div id="headerRowBox">
  <button class="wide" id="newBtn">New</button>
  <button class="wide" id="resetBtn">Reset</button>
  <button class="wide" id="themeBtn"></button>
</div>
<div id="interfaceBox">
  <div id="interfaceNavigationRow">
    <div id="pinGroup">
      <button class="wide" id="pinBtn">Pin</button>
      <button class="wide" id="unpinBtn">Unpin</button>
      <span class="pin-info" id="pinInfo"></span>
    </div>
    <div id="versionGroup">
      <button id="prev" aria-label="previous version">&lt;</button>
      <div class="nav-middle" id="versionMeta"></div>
      <button id="next" aria-label="next version">&gt;</button>
    </div>
    <div id="navigationSpacer"></div>
  </div>
  <div id="interfaceColumns">
    <div id="inputBox">
      <div id="saveLoadResetBox">
        <button class="wide" id="saveBtn">Save Versions</button>
        <button class="wide" id="loadBtn">Load Versions</button>
        <input type="file" accept=".json,application/json" id="loadInput" hidden>
        <button class="wide" id="resetRunsBtn">Reset this version's runs</button>
      </div>
      <div id="costAnalyticsBox"><div id="costLine"></div></div>
      <div id="noteBox">
        <label class="other-label" for="noteText">Note</label>
        <textarea id="noteText" rows="1" wrap="soft" placeholder="Note about this run"></textarea>
      </div>
      <div id="stateAndQuestionsBox">
        <div id="stateBox">
          <div class="btn-row">
            <span class="other-label">state</span>
            <label class="other-label" for="callsInput">calls</label>
            <input id="callsInput" type="number" min="1" max="10" step="1" value="1">
            <button id="submitBtn" class="wide">Submit (paid)</button>
          </div>
          <div id="error" class="error"></div>
          <div id="stateEditor"></div>
        </div>
        <div class="row-resizer" id="rowResizer"></div>
        <div id="questionsBox">
          <span class="other-label">questions</span>
          <div id="questionsEditor"></div>
        </div>
      </div>
    </div>
    <div class="column-resizer" id="columnResizer"></div>
    <div id="resultBox">
      <div id="winnersBox"><div id="hoverLine"></div></div>
      <div id="individualQuestionsBox">
        <div class="btn-row">
          <span class="other-label">questions</span>
          <button class="wide" id="collapseAllBtn">Collapse all</button>
          <button class="wide" id="expandAllBtn">Expand all</button>
        </div>
        <div class="graphs" id="graphs"></div>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="data">__DATA_JSON__</script>
